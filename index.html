<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-wrapper">
    <!-- Header with Title & Stats -->
    <header class="app-header">
      <div class="header-main">
        <h1>To-Do List</h1>
        <p class="subtitle">Keep track of your day</p>
      </div>
      <div class="stats-card">
        <div class="stat-item total">
          <span class="stat-number" id="total-count">0</span>
          <span class="stat-label">Total</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item active">
          <span class="stat-number" id="pending-count">0</span>
          <span class="stat-label">Pending</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item completed">
          <span class="stat-number" id="completed-count">0</span>
          <span class="stat-label">Done</span>
        </div>
      </div>
    </header>

    <!-- Search Section -->
    <section class="search-section" aria-label="Search tasks">
      <div class="search-box">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input 
          type="text" 
          id="search-input" 
          placeholder="Search tasks..." 
          autocomplete="off"
          aria-label="Search tasks"
        >
        <button type="button" id="clear-search-btn" class="clear-btn" aria-label="Clear search" title="Clear search" hidden>
          &times;
        </button>
      </div>
    </section>

    <!-- Add Task Form -->
    <section class="add-section">
      <form id="add-task-form" class="task-form">
        <div class="form-title">Add New Task</div>
        
        <div class="form-group">
          <label for="task-text">Task Description <span class="required">*</span></label>
          <input 
            type="text" 
            id="task-text" 
            placeholder="e.g., Grocery shopping, submit report..." 
            required 
            maxlength="120"
          >
        </div>

        <div class="form-row">
          <div class="form-group flex-1">
            <label for="task-due-date">Due Date</label>
            <input type="date" id="task-due-date">
          </div>

          <div class="form-group status-group">
            <label for="task-status">Status</label>
            <select id="task-status">
              <option value="pending">Not Done</option>
              <option value="completed">Done</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="add-btn">
          <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          Add Task
        </button>
      </form>
    </section>

    <!-- Task List Container -->
    <main class="tasks-section">
      <div class="section-header">
        <h2 id="list-heading">Your Tasks</h2>
      </div>

      <ul id="task-list" class="task-list" aria-live="polite"></ul>

      <!-- Friendly Empty State -->
      <div id="empty-state" class="empty-state" hidden>
        <div class="empty-icon">📝</div>
        <h3 id="empty-title">No tasks yet!</h3>
        <p id="empty-message">Your list is clear. Add your first task above to get organized!</p>
      </div>
    </main>
  </div>

  <!-- Edit Task Modal -->
  <div id="edit-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title" hidden>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="edit-modal-title">Edit Task</h2>
        <button type="button" class="modal-close-btn" id="close-edit-modal-btn" aria-label="Close modal">&times;</button>
      </div>
      <form id="edit-task-form">
        <input type="hidden" id="edit-task-id">

        <div class="form-group">
          <label for="edit-task-text">Task Description <span class="required">*</span></label>
          <input 
            type="text" 
            id="edit-task-text" 
            required 
            maxlength="120"
          >
        </div>

        <div class="form-row">
          <div class="form-group flex-1">
            <label for="edit-task-due-date">Due Date</label>
            <input type="date" id="edit-task-due-date">
          </div>

          <div class="form-group status-group">
            <label for="edit-task-status">Status</label>
            <select id="edit-task-status">
              <option value="pending">Not Done</option>
              <option value="completed">Done</option>
            </select>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="cancel-edit-btn">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Confirm Delete Modal -->
  <div id="confirm-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title" hidden>
    <div class="modal-content modal-confirm">
      <div class="modal-header">
        <h2 id="confirm-modal-title">Delete Task</h2>
        <button type="button" class="modal-close-btn" id="close-confirm-modal-btn" aria-label="Close modal">&times;</button>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to delete this task? This action cannot be undone.</p>
        <p class="delete-task-preview" id="delete-task-preview"></p>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="cancel-delete-btn">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirm-delete-btn">Delete</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
